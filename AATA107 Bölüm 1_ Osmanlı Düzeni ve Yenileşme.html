<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AATA107 Bölüm 1 – Osmanlı Sosyo-Ekonomik Düzen ve Yenileşme</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f3ea;--fg:#1f2a37;--card:#fff;--ac:#8c1c2b;--mu:#5b6573;--ln:#e3dccb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--fg:#e8e6e1;--card:#1d232d;--ac:#e0707f;--mu:#9aa4b2;--ln:#2d3542}}
:root[data-theme="dark"]{--bg:#14181f;--fg:#e8e6e1;--card:#1d232d;--ac:#e0707f;--mu:#9aa4b2;--ln:#2d3542}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,'Times New Roman',serif}
.bar{height:5px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
main{max-width:720px;margin:0 auto;padding:16px}
.tag{color:var(--ac);font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:24px;margin:4px 0 12px}
ul{list-style:none;padding:0;margin:0}
li{background:var(--card);border-left:4px solid var(--ac);border-radius:8px;padding:10px 12px;margin:8px 0;opacity:0;transform:translateY(12px);animation:in .5s forwards}
@keyframes in{to{opacity:1;transform:none}}
.tl{display:flex;overflow-x:auto;gap:8px;padding:6px 0}.tl div{flex:0 0 auto;background:var(--card);border-top:4px solid var(--ac);border-radius:8px;padding:8px 10px;font:13px system-ui;min-width:96px;opacity:0;animation:in .5s forwards}
.tl b{display:block;color:var(--ac)}
.nar{background:var(--card);border:1px dashed var(--mu);border-radius:10px;padding:10px 12px;margin-top:14px;font-style:italic;color:var(--mu)}
button{font:600 14px system-ui;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:4px 4px 0 0}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--ln)}
.wrap{overflow-x:auto}table{border-collapse:collapse;font:13px system-ui;width:100%}td,th{border:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--card);color:var(--ac)}
details{background:var(--card);border-radius:8px;padding:8px 12px;margin:8px 0}summary{font-weight:600}
.q{background:var(--card);border-radius:10px;padding:10px 12px;margin:10px 0}.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--ln);margin:5px 0;font-weight:400}.ok{background:#2e7d4f!important;color:#fff!important}.no{background:#b3261e!important;color:#fff!important}.w{font:14px system-ui;color:var(--mu);margin-top:6px}
footer{position:sticky;bottom:0;background:var(--bg);padding:8px 16px;display:flex;gap:8px;justify-content:center;border-top:1px solid var(--ln)}
</style></head><body>
<div class="bar"><i id="p"></i></div>
<main id="m"></main>
<footer><button class="g" onclick="go(-1)">← Geri</button><button class="g" id="sp" onclick="speak()">🔊 Seslendir</button><button class="g" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">◐</button><button onclick="go(1)">İleri →</button></footer>
<script>
const TL=(a)=>'<div class="tl">'+a.map((x,i)=>`<div style="animation-delay:${i*.25}s"><b>${x[0]}</b>${x[1]}</div>`).join('')+'</div>';
const TB=(h,r)=>'<div class="wrap"><table><tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr>'+r.map(a=>'<tr>'+a.map(x=>`<td>${x}</td>`).join('')+'</tr>').join('')+'</table></div>';
const S=[
{g:"Giriş",t:"Büyük Resim",h:TL([["1299","Kuruluş (geleneksel)"],["XV-XVI. yy","Yükseliş"],["XVII-XVIII. yy","Gerileme"],["1839","Tanzimat"],["1876","I. Meşrutiyet"],["1922","Saltanatın kaldırılması"]]),p:["Ana soru: Güçlü bir devlet neden zayıfladı ve kendini nasıl yenilemeye çalıştı?","Mantık zinciri: düzen → yükseliş → gerileme → Avrupa'nın yükselişi → Fransız Devrimi → yenileşme"],n:"Merhaba. Bu bölümde Osmanlı'nın düzenini, yükselişini ve gerilemesini, ardından yenileşme çabalarını nedenleri ve sonuçlarıyla birlikte izleyeceğiz."},
{g:"Sahne 1",t:"Sosyo-Ekonomik ve Siyasal Düzen",p:["Siyasal yapı: padişah merkezde; Divan-ı Hümayun ve sadrazam yönetimi yürütür. Hukuk: şer'î + örfî (kanunnameler)","Toplum iki gruba ayrılır: askerî (yönetenler) ve reaya (vergi veren üretici halk: çiftçi, esnaf, tüccar; Müslim ve gayrimüslim)","Toprak devletindir (miri arazi). Tımar sistemi: hizmet karşılığı gelir; hem ordu hem taşra yönetimi beslenir","Millet sistemi: gayrimüslimler dinî cemaat olarak iç işlerinde özerk. Ekonomi: tarım temelli, esnaf loncaları, devletin 'önce halkın ve devletin ihtiyacı' anlayışı"],n:"Osmanlı düzeninin anahtarı toprak ve vergidir. Devlet toprağı denetler, reaya üretir, askerî sınıf yönetir. Bu denge bozulduğunda sistem sarsılır."},
{g:"Sahne 2",t:"Yükselişin Nedenleri (XV-XVI. yy)",h:TL([["1453","Fatih, İstanbul'un fethi"],["1517","Yavuz, Mısır seferi: Kutsal topraklar ve Doğu Akdeniz ticareti"],["1526","Kanuni, Mohaç"]]),p:["Güçlü merkezî otorite ve yetenekli padişahlar","Tımar süvarisi + kapıkulu (yeniçeri) ordusu; devşirme ile yetenekli yönetici kadro","Stratejik konum: Doğu-Batı ticaret yollarının denetimi","Adil vergi düzeni ve hoşgörülü millet sistemi, toplumsal istikrar sağlar"],n:"Yükselişi tek bir zafer değil, güçlü devlet, disiplinli ordu, verimli toprak düzeni ve ticaret yollarının denetimi birlikte sağladı."},
{g:"Sahne 3",t:"Gerileme: İç ve Dış Etkenler",p:["İÇ: tımar sisteminin bozulması; vergi toplamada iltizam ve malikâne; yeniçerinin disiplinini kaybedip siyasete karışması; rüşvet, yetenek yerine kayırma","İÇ: nüfus baskısı, enflasyon, Celali isyanları ve ayanların güçlenmesi","DIŞ: coğrafi keşiflerle ticaret yollarının önemini yitirmesi; Avrupa'da Sanayi Devrimi ve askerî üstünlük","DIŞ: kapitülasyonların zamanla Osmanlı aleyhine işlemesi","Kırılma: Karlofça (1699) ilk büyük toprak kaybı; Küçük Kaynarca (1774) ve Kırım'ın kaybı (1783)"],n:"Gerileme bir günde olmadı. Ekonomik temel çöktü, ordu geride kaldı, Avrupa ise bilimde, ekonomide ve silahta ilerledi. Sonuç toprak kaybıydı."},
{g:"Sahne 4",t:"Avrupa'daki Gelişmeler ve Fransız Devrimi",h:TL([["Rönesans-Reform","Bilim, dinî özgürlük"],["Aydınlanma","Akıl, hukuk, hak"],["Sanayi Devrimi","Üretim ve ordu gücü"],["1789","Fransız Devrimi"]]),p:["Devrim: özgürlük, eşitlik, ulus egemenliği. Milliyetçilik çok uluslu imparatorlukları tehdit eder","Osmanlı'da sonuç: Sırp (1804) ve Yunan (1821) isyanları; Yunanistan bağımsızlığı (1830)","Büyük devletler, azınlık sorunlarını müdahale aracı yapar (Doğu Sorunu)","Aynı zamanda Osmanlı aydınlarına yeni fikirler gelir: anayasa, hak, vatandaşlık"],n:"Fransız Devrimi'nin en kalıcı mirası milliyetçilikti. Çok milletli Osmanlı için bu, hem içeride isyan hem dışarıda müdahale demekti."},
{g:"Sahne 5",t:"Yenileşmenin İlk Adımları (XVIII. yy)",h:TL([["1718-1730","Lale Devri"],["1727","İlk matbaa"],["1793","Nizam-ı Cedid"]]),p:["Lale Devri: Nevşehirli Damat İbrahim Paşa; Avrupa'ya elçiler (Yirmisekiz Çelebi Mehmed); matbaa: İbrahim Müteferrika","III. Selim: Nizam-ı Cedid (yeni, Batı tarzı ordu), daimî elçilikler. Yeniçeri ve ayan direnişiyle başarısız","Mantık: önce ordu ıslah edilir; çünkü kayıplar savaş meydanında yaşanıyordu"],n:"İlk yenileşme çabaları Batı'yı taklit etmek ve ordu yoluyla devleti kurtarmaktı. Ama köklü kurumlar, yeniçeriler, buna direndi."},
{g:"Sahne 6",t:"II. Mahmud: Merkezî Devlet",h:TL([["1808","Sened-i İttifak"],["1826","Vaka-i Hayriye"],["1826+","Asakir-i Mansure"]]),p:["Sened-i İttifak (1808): padişah ile ayanlar arası anlaşma; padişah yetkisi sınırlanır, ayanlar tanınır (hukuki belge)","Vaka-i Hayriye (1826): Yeniçeri Ocağı kaldırıldı","Yeni ordu Asakir-i Mansure; nazırlıklar, posta, yeni okullar, Batı usulü giyim: merkeziyetçi modernleşme"],n:"II. Mahmud önce rakipleri etkisiz hale getirdi, sonra merkezi devleti yeniden kurdu. Tanzimat'ın zemini böyle hazırlandı."},
{g:"Sahne 7",t:"Tanzimat ve Islahat Fermanları",p:["Gülhane Hatt-ı Hümayunu (3 Kasım 1839, Abdülmecid; hazırlayan Mustafa Reşid Paşa): Osmanlı Devleti'nin modernleşmesinde dönüm noktası","Islahat Fermanı (18 Şubat 1856; Âli ve Fuad Paşalar): Kırım Savaşı sonrası, Paris Antlaşması öncesi, Avrupa baskısıyla gayrimüslim hakları genişletildi","Kanun-ı Esasi (1876, Midhat Paşa, II. Abdülhamid) ve I. Meşrutiyet; Genç Osmanlılar (Namık Kemal, Ziya Paşa, Şinasi) fikri zemin; Meclis 1878'de kapatıldı"],h:TB(["","Tanzimat 1839","Islahat 1856"],[["Amaç","Devleti kurtarmak, Avrupa güvencesi","Gayrimüslimlerin eşitliği, dış baskı"],["İçerik","Can, mal, namus güvenliği; vergide eşitlik; askerlik düzeni; yargılama","Din ve mezhep özgürlüğü; her alanda eşit; mahkeme, okul, memuriyet"],["Etki","Hukuk devleti ilkesi, merkezî düzen","Müslim–gayrimüslim eşitliği; milliyetçi tepkiler"]]),n:"Tanzimat, padişahın yetkisini hukukla sınırlayan ilk büyük adımdı. Islahat ise eşitlik ilkesini yaygınlaştırdı. Kanun-ı Esasi ise bu yolun anayasal zirvesiydi."},
{g:"Sahne 8",t:"Değerlendirme: Başarı ve Yetersizlik",p:["Aktörler: padişahlar (III. Selim, II. Mahmud, Abdülmecid), bürokratlar (Reşid, Âli, Fuad, Midhat Paşalar), aydınlar (Şinasi, Namık Kemal, Ziya Paşa)","Başarılar: merkezî yönetim, modern ordu, yeni okullar, hukuk, matbaa ve basın, vatandaşlık fikri","Yetersizlik: dıştan alınan, halktan kopuk yenilikler; mali kriz ve borçlar; azınlık milliyetçiliğini durduramama; Batı'ya bağımlılık","Sonuç: Yenileşme devleti kurtaramadı; ama Cumhuriyet'in kurumsal ve fikri temeli oldu"],n:"Yenileşme hareketleri çok şey değiştirdi ama devleti kurtaramadı. Yine de Cumhuriyet'in birikimine ortam hazırladı."},
{g:"Tekrar",t:"Önemli Tarihler ve Kavramlar",h:TB(["Tarih","Olay"],[["1453","İstanbul'un fethi"],["1699","Karlofça"],["1718-30","Lale Devri"],["1789","Fransız Devrimi"],["1793","Nizam-ı Cedid"],["1808","Sened-i İttifak"],["1826","Vaka-i Hayriye"],["1839","Gülhane Hatt-ı Hümayunu"],["1856","Islahat Fermanı"],["1876","Kanun-ı Esasi"]]),p:["Karıştırma: Sened-i İttifak = ayan–padişah; Vaka-i Hayriye = yeniçerinin kaldırılması","Karıştırma: Tanzimat = can-mal güvencesi; Islahat = gayrimüslim eşitliği","Karıştırma: Nizam-ı Cedid (III. Selim) ≠ Asakir-i Mansure (II. Mahmud)"],n:"Önemli olan tarih ezberi değil, sıralama ve nedendir. Her olay bir öncekinin sonucu."}
];
const SQ=[["Reaya kimdir ve askerî sınıftan farkı nedir?","Vergi veren üretici halktır; askerî sınıf ise yönetim ve savaşla görevli sınıftır."],["Tımar sistemi neden bozuldu?","Savaş tekniğinin değişmesi, toprak gelirinin iltizam ve malikâneye dönmesi, merkezin denetiminin zayıflaması."],["Fransız Devrimi Osmanlı'yı nasıl etkiledi?","Milliyetçilik azınlık isyanlarını (Sırp, Yunan) doğurdu; dış müdahale arttı."],["Tanzimat ile Islahat arasındaki temel fark nedir?","Tanzimat: can, mal ve namus güvencesi; Islahat: gayrimüslim eşitliği."],["Yenileşmenin ana yetersizliği nedir?","Dışarıdan alındı, toplumla bütünleşemedi, mali ve siyasi bağımlılık sürdü."]];
const Q=[["Tımar sisteminin temel amacı nedir?",["Dış borç almak","Hizmet karşılığı gelir vererek ordu ve taşra yönetimini beslemek","Loncaları kurmak","Gayrimüslimleri vergiden muaf tutmak"],1,"Tımar, askerî hizmet karşılığı toprak geliri tahsisidir."],["Reaya aşağıdakilerden hangisidir?",["Vergi veren halk","Yeniçeri","Sadrazam","Ayan"],0,"Reaya, vergi veren üretici halktır."],["Osmanlı'nın ilk büyük toprak kaybı hangi antlaşmayladır?",["Küçük Kaynarca","Karlofça","Paris","Londra"],1,"Karlofça (1699) ilk büyük toprak kaybıdır."],["İlk matbaayı Osmanlı'da kuran kişi kimdir?",["İbrahim Müteferrika","Namık Kemal","Mustafa Reşid Paşa","Şinasi"],0,"Lale Devri'nde 1727'de kurulmuştur."],["Nizam-ı Cedid hangi padişahın girişimidir?",["II. Mahmud","III. Selim","Abdülmecid","I. Mahmud"],1,"III. Selim yeni Batı tarzı ordu kurmaya çalıştı."],["Yeniçeri Ocağı hangi olayla kaldırıldı?",["Sened-i İttifak","Vaka-i Hayriye","Gülhane Hatt-ı","Islahat"],1,"1826'da II. Mahmud tarafından kaldırıldı."],["Sened-i İttifak neyi ifade eder?",["Anayasa ilanı","Padişah ile ayanlar arası anlaşma","Kırım Savaşı sonrası fermanı","Yeniçerinin kaldırılması"],1,"1808'de merkezî otorite ile ayanlar arasında yapılan belgedir."],["Gülhane Hatt-ı Hümayunu'nun hazırlayıcısı kimdir?",["Midhat Paşa","Mustafa Reşid Paşa","Fuad Paşa","Ziya Paşa"],1,"Abdülmecid döneminde Mustafa Reşid Paşa hazırladı."],["Islahat Fermanı hangi alana odaklanır?",["Yeniçeri ıslahı","Gayrimüslim haklarının genişletilmesi","Anayasanın ilanı","Matbaa"],1,"1856'da Kırım Savaşı sonrası eşitlik ilkesi vurgulandı."],["Fransız Devrimi'nin Osmanlı'ya en doğrudan etkisi hangisi?",["Matbaa","Balkanlarda milliyetçi isyanlar","Tımarın kaldırılması","Lale Devri"],1,"Milliyetçilik Sırp ve Yunan isyanlarına yol açtı."]];
let i=0,L=S.length+2;
function render(){const m=document.getElementById('m');speechSynthesis.cancel();
document.getElementById('p').style.width=((i+1)/L*100)+'%';let h='';
if(i<S.length){const s=S[i];h=`<div class="tag">${s.g}</div><h1>${s.t}</h1>${s.h||''}<ul>${s.p.map((x,j)=>`<li style="animation-delay:${.3+j*.35}s">${x}</li>`).join('')}</ul><div class="nar">🎙 ${s.n}</div>`}
else if(i==S.length){h='<div class="tag">Tekrar</div><h1>5 Kısa Cevaplı Soru</h1>'+SQ.map(x=>`<details><summary>${x[0]}</summary><div class="w">${x[1]}</div></details>`).join('')}
else{h='<div class="tag">Sınav</div><h1>10 Çoktan Seçmeli Soru</h1>'+Q.map((q,k)=>`<div class="q"><b>${k+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="o" onclick="ans(this,${k},${j})">${'ABCD'[j]}) ${o}</button>`).join('')}<div class="w" id="w${k}"></div></div>`).join('')+'<div class="w">Not: Bu sorular çalışma amaçlı hazırlanmıştır, çıkmış sorular değildir.</div>'}
m.innerHTML=h;scrollTo(0,0)}
function ans(b,k,j){const q=Q[k];const bs=b.parentNode.querySelectorAll('.o');bs.forEach((x,y)=>{x.disabled=true;if(y==q[2])x.classList.add('ok')});if(j!=q[2])b.classList.add('no');document.getElementById('w'+k).textContent=(j==q[2]?'Doğru. ':'Yanlış. ')+'Neden: '+q[3]}
function go(d){i=Math.max(0,Math.min(L-1,i+d));render()}
function speak(){if(i>=S.length)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(S[i].n);u.lang='tr-TR';speechSynthesis.speak(u)}
render();
</script></body></html>
